# 节点信息
proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# 全局配置
mixed-port: 7893
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true


# DNS
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:7874
  ipv6: true
  respect-rules: true

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  fake-ip-filter:
    - rule-set:domain_private
    - "*.lan"
    - "*.local"
    - "*.home.arpa"
    - localhost.ptlogin2.qq.com
    - connectivity-check
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.pool.ntp.org"
    - "+.time.apple.com"
    - "+.time.windows.com"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.12.12.12

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.12.12.12

  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true

  nameserver:
    - "https://1.1.1.1/dns-query#默认代理"
    - "https://dns.google/dns-query#默认代理"

  nameserver-policy:
    "rule-set:domain_private":
      - 223.5.5.5
      - 119.29.29.29
    "rule-set:domain_cn":
      - 223.5.5.5
      - 119.29.29.29
    "rule-set:cnm_domain":
      - 223.5.5.5
      - 119.29.29.29
    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29

# 嗅探
sniffer:
  enable: true
  parse-pure-ports: true
  sniff:
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8888], override-destination: true}
    QUIC: {ports: [443, 8443]}
  skip-domain: ["+.apple.com", "+.netflix.com", "+.icloud.com", "+.mzstatic.com", "MESSAGES.apple.com", "+.cloudflare.com"]
  skip-src-address:
    - '192.168.5.1'
    
