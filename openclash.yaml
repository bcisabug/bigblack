# 机场订阅1.1 优化dns版
proxy-providers:
  "1.光喵":
    url: "订阅地址"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800
      timeout: 5000
      lazy: true
      expected-status: 204
    proxy: 直连
    override:
      dialer-proxy: 光喵
      additional-suffix: " | 光喵"
      client-fingerprint: chrome

  "2.牛逼":
    url: "订阅地址"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800
      timeout: 5000
      lazy: true
      expected-status: 204
    proxy: 直连
    override:
      dialer-proxy: 牛逼
      additional-suffix: " | 牛逼"
      client-fingerprint: chrome

  "3.一元":
    url: "订阅地址"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800
      timeout: 5000
      lazy: true
      expected-status: 204
    proxy: 直连
    override:
      dialer-proxy: 一元
      additional-suffix: " | 一元"
      client-fingerprint: chrome

  "4.钢蛋":
    url: "订阅地址"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800
      timeout: 5000
      lazy: true
      expected-status: 204
    proxy: 直连
    override:
      dialer-proxy: 钢蛋
      additional-suffix: " | 钢蛋"
      client-fingerprint: chrome

# 节点信息
proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  # Fake-IP 排除域名
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
    - "rule-set:private_domain"
    - "*.lan"
    - "*.local"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "connectivity-check"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.pool.ntp.org"
    - "+.time.apple.com"
    - "+.time.windows.com"

  # DNS 引导解析
  # 只负责解析 DoH 服务器自身的域名
  default-nameserver: [223.5.5.5, 119.29.29.29, 1.12.12.12]

  # 代理节点域名解析
  # 必须保持稳定、快速，避免代理节点本身解析失败
  proxy-server-nameserver: [223.5.5.5, 119.29.29.29, 1.12.12.12]

  # 普通 DNS
  # 国内优先使用国内 DNS
  nameserver: ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]

  # 国内域名走国内 DNS
  # 国外域名交给上面的 DoH
  nameserver-policy:
    "rule-set:private_domain": [223.5.5.5, 119.29.29.29]
    "rule-set:cn_domain": [223.5.5.5, 119.29.29.29]
    "rule-set:cnm_domain": [223.5.5.5, 119.29.29.29]
    "geosite:cn": [223.5.5.5, 119.29.29.29]

# 嗅探
sniffer:
  enable: true
  parse-pure-ports: true
  sniff:
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8888], override-destination: true}
    QUIC: {ports: [443, 8443]}
  skip-domain: ["+.apple.com", "+.netflix.com", "+.icloud.com", "+.mzstatic.com", "MESSAGES.apple.com", "+.cloudflare.com"]
  skip-src-address: ["192.168.5.1"]

# 出站策略组
