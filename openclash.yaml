# 规则匹配
rules:
  - DOMAIN,dns.alidns.com,直连
  - DOMAIN,doh.pub,直连

  # 1. 局域网与本地直连（最高优先级）
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private_domain,直连

  # 广告拦截
  - RULE-SET,fakeipfilter_domain,REJECT-DROP

  # 2. 自定义特殊绕过
  - DOMAIN-SUFFIX,steamserver.net, 国内直连
  - DOMAIN-SUFFIX,qichiyu.com, 默认代理
  - DOMAIN-KEYWORD,xn--, 默认代理
  - DOMAIN-KEYWORD,光喵, 默认代理
  - DOMAIN-KEYWORD,idsduf, 默认代理
  - DOMAIN-KEYWORD,docker, 默认代理

  # BT/PT
  - DOMAIN-KEYWORD,tracker,直连
  - DOMAIN-KEYWORD,torrent,直连
  - DST-PORT,6881,直连

  # 3. 垂直细分领域代理
  - RULE-SET,ai_domain, AI
  - RULE-SET,github_domain, GitHub
  - RULE-SET,youtube_domain, 油管
  - RULE-SET,steam_domain, steam
  - RULE-SET,Nintendo_domain, steam
  - RULE-SET,Epic_domain, steam
  - RULE-SET,Origin_domain, steam
  - RULE-SET,google_domain, Google
  - RULE-SET,onedrive_domain, OneDrive
  - RULE-SET,microsoft_domain, Microsoft
  - RULE-SET,apple_domain, Apple
  - RULE-SET,tiktok_domain, TikTok
  - RULE-SET,telegram_domain, Telegram
  - RULE-SET,speedtest_domain, Speedtest
  - RULE-SET,netflix_domain, NETFLIX
  - RULE-SET,disney_domain, 迪士尼
  - RULE-SET,paypal_domain, PayPal

  # 4. IP 规则匹配
  - RULE-SET,apple_ip, Apple
  - RULE-SET,google_ip, Google
  - RULE-SET,netflix_ip, NETFLIX
  - RULE-SET,telegram_ip, Telegram

  # 5. 媒体与被墙大类兜底
  - RULE-SET,video_domain, 国外媒体
  - RULE-SET,gfw_domain, 默认代理
  - RULE-SET,proxylite_domain, 默认代理

  # 6. 国内流量直连
  - RULE-SET,cn_domain, 国内直连
  - RULE-SET,cnm_domain, 国内直连
  - RULE-SET,cn_ip, 国内直连

  # 7. 最终兜底
  - MATCH, 漏网之鱼

