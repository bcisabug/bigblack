  - RULE-SET,domain_docker, GitHub
  - RULE-SET,domain_npmjs, GitHub
  - RULE-SET,domain_jetbrains, GitHub
  - RULE-SET,domain_stackexchange, GitHub

  # steam：全部规则共用一个分类组
  - RULE-SET,domain_steam, steam
  - RULE-SET,domain_epicgames, steam
  - RULE-SET,domain_xbox, steam
  - RULE-SET,domain_playstation, steam
  - RULE-SET,domain_nintendo, steam
  - RULE-SET,domain_roblox, steam
  - RULE-SET,domain_ea, steam
  - RULE-SET,domain_ubisoft, steam
  - RULE-SET,domain_blizzard, steam

  # 云服务：Google、OneDrive、Apple 分别使用原组，其余使用默认代理
