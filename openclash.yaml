# 机场订阅1.2 lazy：true
proxy-providers:
  "1.光喵":
    url: "xx"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800
      timeout: 5000
      lazy: true
      expected-status: 204
    proxy: 直连
    override:
      dialer-proxy: 光喵
      additional-suffix: " | 光喵"
      client-fingerprint: chrome

  "2.牛逼":
