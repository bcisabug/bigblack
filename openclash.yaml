# 分流规则：保留原有业务策略组，具体服务优先，分类总集兜底
rules:
  - DOMAIN,dns.alidns.com,直连
  - DOMAIN,doh.pub,直连
  - RULE-SET,ip_private, 直连,no-resolve
  - RULE-SET,domain_private, 直连
  - RULE-SET,domain_category-ads-all, REJECT-DROP
  # 追踪器集合已定义但默认不拦截，避免扩大原有拦截范围。
  # - RULE-SET,domain_tracker,REJECT

  # 用户原有特殊规则（Docker 关键词改由后面的专用集合替代）
  - DOMAIN-SUFFIX,steamserver.net, 国内直连
  - DOMAIN-SUFFIX,qichiyu.com, 默认代理
  - DOMAIN-KEYWORD,xn--, 默认代理
  - DOMAIN-KEYWORD,光喵, 默认代理
  - DOMAIN-KEYWORD,idsduf, 默认代理
  - DOMAIN-SUFFIX,tw, 默认代理
  - DOMAIN-SUFFIX,duoduo.uno, 默认代理
  - DOMAIN-KEYWORD,tracker,直连
  - DOMAIN-KEYWORD,torrent,直连
  - DST-PORT,6881,直连

  # 国内服务例外优先于对应平台总集
  - RULE-SET,domain_apple-cn, 国内直连
  - RULE-SET,domain_microsoft_at_cn, 国内直连
  - RULE-SET,domain_google-cn, 国内直连
  - RULE-SET,domain_steam_at_cn, 国内直连
  - RULE-SET,domain_bilibili, 国内直连

